name: ci

on:
  push:
    branches: ["**"]       # tags (e.g. the historical v0.1) are not re-checked
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: check (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHONHASHSEED: "0"
        run: python -m vouchai check --out "$RUNNER_TEMP/vouchai"

      - name: check from a Cyrillic path with spaces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "Жұмыс үстелі\genesis copy"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force -Path * -Destination $dst
          Set-Location $dst
          python -m vouchai check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t vouchai .
      - name: base image digest (pinned in the Dockerfile)
        continue-on-error: true
        run: |
          docker pull -q python:3.11-slim > /dev/null
          docker image inspect python:3.11-slim --format '{{index .RepoDigests 0}}'
      - name: official one-command check, no network, 2 CPU, 4 GB
        run: |
          start=$(date +%s)
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cpus 2 --memory 4g vouchai check
          echo "wall time: $(( $(date +%s) - start )) s"
      - name: jury adapter and emulation of the jury's checks (quick), no network
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python             vouchai -c "import judge_adapter as ja; print(ja.make_env, ja.score_episode)"
          docker run --rm --network none --read-only --tmpfs /tmp             vouchai judge-selftest --quick --no-write
      - name: isolated official run, zone B and policy as different OS users, spy
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --user 0 vouchai             eval --isolated --policy simple_reconciler --config jury_like --seeds 0:5 --spy

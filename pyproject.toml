[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchai"
version = "0.1.0"
description = "RL environment for training AI financial auditors: synthetic companies, investigation tools, hidden accounting errors and an evidence-based reward."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# The core and the official check use the Python standard library only.
dependencies = []

[project.scripts]
vouchai = "vouchai.cli:main"

[tool.setuptools.packages.find]
include = ["vouchai*", "vouchai_verify*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

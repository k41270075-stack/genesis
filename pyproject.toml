[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchai"
version = "1.3.2"
description = "RL environment for training AI financial auditors: synthetic companies, investigation tools, hidden accounting errors and an evidence-based reward."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# The core and the official check use the Python standard library only.
dependencies = []

[project.scripts]
vouchai = "vouchai.cli:main"

[tool.setuptools.packages.find]
include = ["vouchai*", "vouchai_verify*", "vouchai_learn*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site"]   # the web demo has its own toolchain

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# UP038: isinstance(x, (A, B)) is clearer and faster than A | B.
# B905: zip() over lists of equal length by construction.
ignore = ["UP038", "B905"]
